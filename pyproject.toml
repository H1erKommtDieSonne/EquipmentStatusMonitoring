[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "equipment-status-monitoring"
version = "0.1.0"
requires-python = ">=3.11"

[tool.scikit-build]
cmake.minimum-version = "3.18"
build-dir = "build/{wheel_tag}"
wheel.packages = []
wheel.install-dir = "."
